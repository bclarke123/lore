# Builds the `lore` CLI and `loreserver` binaries for Linux and macOS,
# packaged the way Lore releases are shipped:
#   - `release-lto` profile (the actual release build per Cargo.toml)
#   - one tarball per binary, named `<binary>-v<version>-<rust-triple>.tar.gz`
#     (the exact shape scripts/install.sh matches)
#   - the aarch64-linux build carries the repo's Graviton3 codegen flags, so
#     its tarball gets the `.neoverse-512tvb` micro-arch suffix install.sh
#     expects for non-generic builds
#   - Linux debug info is split out at packaging time (objcopy + debuglink,
#     mirroring the release packaging); macOS emits .dSYM bundles at build
#     time. Symbols upload as a separate artifact.

name: Build binaries

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which architecture(s) to build
        type: choice
        default: linux-x86_64
        options:
          - linux-x86_64
          - all
          - linux-aarch64
          - macos-aarch64
      runner:
        description: >-
          Runner label override for the selected target(s), e.g. a larger
          hosted runner's label or a self-hosted label. Empty = the
          target's default hosted runner.
        type: string
        default: ""
  push:
    branches: [main]

permissions: {}

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Selects which matrix entries to build. linux-x86_64 (the deployment
  # target) is the default for both pushes and manual dispatches; pick
  # `all` or another target explicitly when cutting a multi-platform
  # release. (A separate job because `matrix` is not available in
  # job-level `if` expressions.)
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select targets
        id: select
        env:
          TARGET: ${{ inputs.target || 'linux-x86_64' }}
          RUNNER_OVERRIDE: ${{ inputs.runner || '' }}
        run: |
          set -euo pipefail
          all='[
            {"name": "linux-x86_64", "runner": "ubuntu-latest", "asset-suffix": ""},
            {"name": "linux-aarch64", "runner": "ubuntu-24.04-arm", "asset-suffix": ".neoverse-512tvb"},
            {"name": "macos-aarch64", "runner": "macos-latest", "asset-suffix": ""}
          ]'
          if [ "$TARGET" = "all" ]; then
            selected=$(printf '%s' "$all" | jq -c '.')
          else
            selected=$(printf '%s' "$all" | jq -c --arg t "$TARGET" 'map(select(.name == $t))')
          fi
          selected=$(printf '%s' "$selected" | jq -c --arg r "$RUNNER_OVERRIDE" \
            'if $r != "" then map(.runner = $r) else . end')
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
          echo "Building: $(printf '%s' "$selected" | jq -r 'map("\(.name) on \(.runner)") | join(", ")')"

  build:
    name: build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-${{ matrix.name }}-

      # The release-lto target dir alone can outgrow the hosted runners'
      # free root disk; drop the preinstalled toolchains we never use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift 2>/dev/null || true
          df -h /

      # Fat-LTO links are memory-hungry; the hosted runners (especially ARM)
      # can OOM-kill the linker (exit 143). Give the build headroom. Newer
      # ubuntu images ship an ACTIVE swapfile at /swapfile, so replace it
      # (fallocate on the live file fails with "Text file busy").
      - name: Add swap space
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Build the two binaries sequentially so their final LTO links never
      # run concurrently (each link alone can use most of the runner's RAM).
      - name: Build lore and loreserver
        run: |
          cargo build --profile release-lto -p lore-client
          cargo build --profile release-lto -p lore-server

      - name: Package release tarballs
        env:
          ASSET_SUFFIX: ${{ matrix.asset-suffix }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p dist/symbols
          cd target/release-lto
          for bin in lore loreserver; do
            if [ "$RUNNER_OS" = "Linux" ]; then
              # Split the embedded DWARF the way release packaging does:
              # symbols to a .debug file, stripped binary with a debuglink.
              objcopy --only-keep-debug "$bin" "$bin.debug"
              objcopy --strip-debug --add-gnu-debuglink="$bin.debug" "$bin"
              mv "$bin.debug" "$GITHUB_WORKSPACE/dist/symbols/"
            elif [ -d "$bin.dSYM" ]; then
              # macOS: split-debuginfo=packed already emitted the bundle.
              tar czf "$GITHUB_WORKSPACE/dist/symbols/$bin.dSYM.tar.gz" "$bin.dSYM"
            fi
            tar czf \
              "$GITHUB_WORKSPACE/dist/$bin-v$version-$triple$ASSET_SUFFIX.tar.gz" \
              "$bin"
          done
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lore-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lore-${{ matrix.name }}-symbols
          path: dist/symbols/
          if-no-files-found: error
          retention-days: 14
